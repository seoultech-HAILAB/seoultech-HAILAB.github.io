# Cloudflare Worker 설정 — 홈페이지 오른쪽 아래 'HAI Lab 도우미' 가 부르는 곳.
#
# 대시보드에서 코드를 붙여넣는 대신 이 파일로 터미널에서 배포한다. 그래야 코드가
# 저장소 안의 tools/hai-ask.worker.js 한 곳에만 있고, 대시보드 사본과 어긋나지 않는다.
#
# 배포 순서
#   npx wrangler login                       # 브라우저로 Cloudflare 로그인 (1회)
#   npx wrangler deploy                      # 배포
#   npx wrangler secret put OPENAI_API_KEY   # 키를 물어보면 그때 붙여넣는다
#
# 키는 이 파일에 절대 적지 않는다. secret 으로만 넣으면 Cloudflare 안에만 남고
# 저장소·대시보드 어디에도 노출되지 않는다.

name = "hai-ask"
main = "tools/hai-ask.worker.js"
compatibility_date = "2026-08-26"

# workers.dev 주소를 받는다 (https://hai-ask.<계정>.workers.dev)
workers_dev = true

# 값이 아니라 '이 이름의 secret 을 쓴다' 는 선언이다. 실제 값은 위 secret put 으로 넣는다.
[observability]
enabled = true
